<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💃</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a0f14" />
    <title>Guapea — Lista de asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      crypto.randomUUID is secure-context only (HTTPS / localhost).
      On phones via http://192.168.x.x it is missing and Neon Auth crashes → white screen.
    -->
    <script>
      (function () {
        if (typeof crypto === 'undefined' || typeof crypto.randomUUID === 'function') return
        if (typeof crypto.getRandomValues !== 'function') return
        crypto.randomUUID = function randomUUID() {
          var bytes = new Uint8Array(16)
          crypto.getRandomValues(bytes)
          bytes[6] = (bytes[6] & 0x0f) | 0x40
          bytes[8] = (bytes[8] & 0x3f) | 0x80
          var hex = Array.from(bytes, function (b) {
            return b.toString(16).padStart(2, '0')
          }).join('')
          return (
            hex.slice(0, 8) +
            '-' +
            hex.slice(8, 12) +
            '-' +
            hex.slice(12, 16) +
            '-' +
            hex.slice(16, 20) +
            '-' +
            hex.slice(20)
          )
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
